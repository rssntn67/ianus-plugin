# TEMPLATE della configurazione di IANUS Plugin: non viene usato cosi' com'e'.
# Copiarlo fuori dal repository, compilarlo e avviare il plugin indicando il file:
#
#   cp config/ianus-template.yml /etc/ianus/ianus.yml
#   java -jar ianus-plugin.jar --ianus.config=/etc/ianus/ianus.yml
#
# Senza questo file il plugin non si avvia (vedi README, "Configurazione obbligatoria").
# Il file compilato contiene credenziali in chiaro: proteggerlo e non versionarlo.

server:
  port: 8080

ianus:
  # Obbligatoria: IANUS la invia nell'header X-API-Key. Se resta vuota il plugin non si avvia
  api-key: ""
  plugin-version: 2.0.0
  # Finestre supportate: PT5M e PT30M sono obbligatorie, se ne possono aggiungere altre
  windows: [PT5M, PT30M]
  default-page-size: 500
  max-page-size: 5000
  # Storia conservata in memoria: le finestre piu' vecchie non si possono chiedere
  retention: PT3H

  sources:
    opennms:
      enabled: false
      # Ampiezza dei blocchi e frequenza di raccolta: deve dividere ogni finestra supportata
      collect-interval: PT5M
      # Attesa dopo la fine del blocco, perche' l'NMS abbia i dati
      collect-delay: PT1M
      id: opennms-01
      url: http://localhost:8980/opennms
      username: ${OPENNMS_USER:admin}
      password: ${OPENNMS_PASSWORD:}
      # nodes: [router-core-1, srv-db-01]   # vuoto = tutti i nodi
      sample-step: PT5M
      units:
        - attribute: ifHCInOctets
          unit: bytes_per_second
        - attribute: ifHCOutOctets
          unit: bytes_per_second

    prometheus:
      enabled: false
      # Ampiezza dei blocchi e frequenza di raccolta: deve dividere ogni finestra supportata
      collect-interval: PT5M
      # Attesa dopo la fine del blocco, perche' l'NMS abbia i dati
      collect-delay: PT1M
      id: prometheus-01
      url: http://localhost:9090
      node-label: instance
      # Una serie senza campioni nella finestra esce con valori null se ne ha in questo periodo
      series-lookback: PT1H
      # Etichette degli alert che compongono instance degli eventi, unite da "/" (es. [device])
      alert-instance-labels: []
      # name: nome IANUS della metrica, in minuscolo con _ (altrimenti il plugin non parte)
      metrics:
        - name: cpu_usage
          selector: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100
          kind: gauge
          unit: percent
        - name: memory_available
          selector: node_memory_MemAvailable_bytes
          kind: gauge
          unit: bytes
        - name: if_in_traffic
          selector: node_network_receive_bytes_total{device!="lo"}
          kind: counter
          unit: bytes_per_second
          instance-labels: [device]

    icinga:
      enabled: false
      # Ampiezza dei blocchi e frequenza di raccolta: deve dividere ogni finestra supportata
      collect-interval: PT5M
      # Attesa dopo la fine del blocco, perche' l'NMS abbia i dati
      collect-delay: PT1M
      id: icinga-01
      url: https://localhost:5665
      username: ${ICINGA_USER:ianus}
      password: ${ICINGA_PASSWORD:}
      insecure: false
      poll-interval: PT30S
      retention: PT24H

    zabbix:
      enabled: false
      # Ampiezza dei blocchi e frequenza di raccolta: deve dividere ogni finestra supportata
      collect-interval: PT5M
      # Attesa dopo la fine del blocco, perche' l'NMS abbia i dati
      collect-delay: PT1M
      id: zabbix-01
      url: http://localhost/zabbix/api_jsonrpc.php
      token: ${ZABBIX_TOKEN:}
      auth-mode: header
      # host-group-ids: ["2", "4"]
      # Item contatore (chiavi senza parametri): il plugin ne calcola il tasso al secondo.
      # Un contatore non elencato qui e senza preprocessing "change per second" esce con il valore grezzo.
      # counter-keys: [net.if.in, net.if.out]
      # Periodo in cui cercare il campione precedente: deve superare l'intervallo di aggiornamento degli item
      # counter-lookback: PT15M
